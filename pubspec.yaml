name: wintrix_pro
description: "A premium Flutter project for Wintrix Pro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Network & Download Management (Splash Screen APK Downloader)
  dio: ^5.7.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

  # Firebase Core & Feature SDKs
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  firebase_database: ^11.0.3

  # Social Authentication
  google_sign_in: ^6.2.1

  # UI Design Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Splash screen logo and wings activation
  assets:
    - assets/
